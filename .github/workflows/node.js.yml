# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    tags:
      - 'aba-*'

jobs:
  build:
    name: build-nest
    runs-on: ubuntu-latest
    steps:
      - name: Connect to the server and deploy using SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          # npm run build
          # pm2 restart ./dist/src/main.js --name realworld-server
          # yarn && pm2 stop nest && pm2 delete nest && yarn build && pm2 list && pm2 start --name nest dist/main.js
          #   ls -al
          script: |
            cd /www/wwwroot/nestApi/
            git fetch origin
            git tag -l -n
            git checkout ${{ github.ref_name }}

      - name: install
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'

      - run: yarn
